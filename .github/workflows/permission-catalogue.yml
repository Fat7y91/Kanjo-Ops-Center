name: Permission catalogue

on:
  push:
    branches: [main, feat/v2-enterprise-architecture]
  pull_request:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test permission catalogue helpers
        run: npm test
      - name: Check catalogue drift
        run: npm run check:permissions
