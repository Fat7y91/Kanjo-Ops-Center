# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate runtime config from environment
        run: node scripts/build-config.mjs
        env:
          KANJO_DRIVE_SCRIPT_URL: ${{ secrets.KANJO_DRIVE_SCRIPT_URL }}
          KANJO_DRIVE_SCRIPT_TOKEN: ${{ secrets.KANJO_DRIVE_SCRIPT_TOKEN }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KANJO_DESOUK }}
          channelId: live
          projectId: kanjo-desouk
      - name: Write Firebase service account
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KANJO_DESOUK }}
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/firebase-sa.json"
      # Diagnostic: surface which principal the deploy authenticates as, so IAM
      # bindings can be verified against the correct service account.
      - name: Show deploy service account
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "${{ runner.temp }}/firebase-sa.json"
        run: |
          node -e "console.log('Deployer service account: ' + require(process.env.GOOGLE_APPLICATION_CREDENTIALS).client_email)"
      # Diagnostic: read back the effective project + appspot-SA IAM policy using
      # the deploy credentials, to prove whether the grants landed.
      - name: Inspect CI service account IAM (diagnostic)
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "${{ runner.temp }}/firebase-sa.json"
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const https = require('https');
          const sa = JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, 'utf8'));
          const b64 = (b) => Buffer.from(b).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const head = b64(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
          const claims = b64(JSON.stringify({ iss: sa.client_email, scope: 'https://www.googleapis.com/auth/cloud-platform', aud: 'https://oauth2.googleapis.com/token', iat: now, exp: now + 3600 }));
          const signer = crypto.createSign('RSA-SHA256');
          signer.update(head + '.' + claims);
          const jwt = head + '.' + claims + '.' + b64(signer.sign(sa.private_key));
          const request = (opts, body) => new Promise((resolve, reject) => {
            const u = new URL(opts.url);
            const r = https.request({ hostname: u.hostname, path: u.pathname + u.search, method: opts.method, headers: opts.headers }, (res) => {
              let d = '';
              res.on('data', (c) => (d += c));
              res.on('end', () => resolve({ status: res.statusCode, body: d }));
            });
            r.on('error', reject);
            if (body) r.write(body);
            r.end();
          });
          const member = 'serviceAccount:' + sa.client_email;
          (async () => {
            const t = await request({ url: 'https://oauth2.googleapis.com/token', method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' } }, 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=' + jwt);
            const token = JSON.parse(t.body).access_token;
            console.log('Token OK for ' + member);
            const proj = await request({ url: 'https://cloudresourcemanager.googleapis.com/v3/projects/kanjo-desouk:getIamPolicy', method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token } }, JSON.stringify({ options: { requestedPolicyVersion: 3 } }));
            console.log('project getIamPolicy HTTP ' + proj.status);
            if (proj.status === 200) {
              const pol = JSON.parse(proj.body);
              const roles = (pol.bindings || []).filter((b) => (b.members || []).includes(member)).map((b) => b.role);
              console.log('Project-level roles for ' + member + ': ' + (roles.length ? roles.join(', ') : '(none)'));
            } else {
              console.log(proj.body.slice(0, 300));
            }
            const saPath = encodeURIComponent('kanjo-desouk@appspot.gserviceaccount.com');
            const saPol = await request({ url: 'https://iam.googleapis.com/v1/projects/kanjo-desouk/serviceAccounts/' + saPath + ':getIamPolicy', method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token } }, '{}');
            console.log('appspot SA getIamPolicy HTTP ' + saPol.status);
            if (saPol.status === 200) {
              const pol = JSON.parse(saPol.body);
              const roles = (pol.bindings || []).filter((b) => (b.members || []).includes(member)).map((b) => b.role);
              console.log('Direct appspot-SA roles for ' + member + ': ' + (roles.length ? roles.join(', ') : '(none)'));
            } else {
              console.log(saPol.body.slice(0, 300));
            }
          })().catch((e) => console.log('diagnostic failed: ' + e.message));
          NODE
      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "${{ runner.temp }}/firebase-sa.json"
          CI: true
        run: npx -y firebase-tools@latest deploy --only firestore:rules --project kanjo-desouk
      # Best-effort: the CI service account may lack datastore.indexes.create.
      # Indexes are a performance optimisation, so never fail the deploy on them.
      - name: Deploy Firestore indexes (best-effort)
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "${{ runner.temp }}/firebase-sa.json"
          CI: true
        run: npx -y firebase-tools@latest deploy --only firestore:indexes --project kanjo-desouk
      # Server-side contract PDF microservice (functions/). Dependencies are
      # installed locally so the CLI can analyse the source before uploading.
      - name: Install function dependencies
        run: npm install --prefix functions --omit=dev --no-audit --no-fund
      # Best-effort until a project owner enables the Cloud Functions API and
      # grants the CI service account the deploy roles (Run/Artifact Registry/
      # Cloud Build/Service Usage). Once enabled this deploys automatically.
      - name: Deploy Cloud Functions (best-effort)
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "${{ runner.temp }}/firebase-sa.json"
          CI: true
        run: npx -y firebase-tools@latest deploy --only functions --project kanjo-desouk
      # Locked-down Storage rules for the contracts bucket. Best-effort so a
      # first-time bucket provisioning hiccup never blocks a release.
      - name: Deploy Storage rules (best-effort)
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "${{ runner.temp }}/firebase-sa.json"
          CI: true
        run: npx -y firebase-tools@latest deploy --only storage --project kanjo-desouk
      # Record the successful deployment in the Black Box audit trail so the
      # founder can track codebase releases. Never fail the deploy on logging.
      - name: Log deployment to Black Box
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "${{ runner.temp }}/firebase-sa.json"
          GITHUB_SHA: ${{ github.sha }}
          DEPLOY_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          npm install firebase-admin@12
          node scripts/log-deployment.mjs

