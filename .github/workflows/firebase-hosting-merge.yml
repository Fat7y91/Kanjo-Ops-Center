# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate runtime config from environment
        run: node scripts/build-config.mjs
        env:
          KANJO_DRIVE_SCRIPT_URL: ${{ secrets.KANJO_DRIVE_SCRIPT_URL }}
          KANJO_DRIVE_SCRIPT_TOKEN: ${{ secrets.KANJO_DRIVE_SCRIPT_TOKEN }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KANJO_DESOUK }}
          channelId: live
          projectId: kanjo-desouk
      - name: Write Firebase service account
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KANJO_DESOUK }}
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/firebase-sa.json"
      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "${{ runner.temp }}/firebase-sa.json"
          CI: true
        run: npx -y firebase-tools@latest deploy --only firestore:rules --project kanjo-desouk
      # Best-effort: the CI service account may lack datastore.indexes.create.
      # Indexes are a performance optimisation, so never fail the deploy on them.
      - name: Deploy Firestore indexes (best-effort)
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "${{ runner.temp }}/firebase-sa.json"
          CI: true
        run: npx -y firebase-tools@latest deploy --only firestore:indexes --project kanjo-desouk
      # Record the successful deployment in the Black Box audit trail so the
      # founder can track codebase releases. Never fail the deploy on logging.
      - name: Log deployment to Black Box
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "${{ runner.temp }}/firebase-sa.json"
          GITHUB_SHA: ${{ github.sha }}
          DEPLOY_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          npm install firebase-admin@12
          node scripts/log-deployment.mjs

