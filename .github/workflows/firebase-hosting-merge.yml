# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate runtime config from environment
        run: node scripts/build-config.mjs
        env:
          KANJO_DRIVE_SCRIPT_URL: ${{ secrets.KANJO_DRIVE_SCRIPT_URL }}
          KANJO_DRIVE_SCRIPT_TOKEN: ${{ secrets.KANJO_DRIVE_SCRIPT_TOKEN }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KANJO_DESOUK }}
          channelId: live
          projectId: kanjo-desouk
      - name: Deploy Firestore security rules
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KANJO_DESOUK }}' > "$RUNNER_TEMP/firebase-sa.json"
          npx -y firebase-tools@latest deploy --only firestore:rules --project kanjo-desouk
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "${{ runner.temp }}/firebase-sa.json"
          CI: true
