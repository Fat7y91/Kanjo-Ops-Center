# Denormalizes each merchant's contract status ('final'/'vip') and mapped
# product count onto the `merchants` collection, so the isolated marketing
# agency portal can filter and group vendors without reading operational
# `tasks`. Manual only: the daily cron + push triggers each re-read the whole
# collection and were a recurring read-cost driver. Run it from the Actions
# tab (workflow_dispatch) when a status backfill is actually needed.
name: Sync merchant contract status
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install firebase-admin
        run: npm install firebase-admin@12
      # Optional: resizes merchant logos to small card thumbnails before upload.
      # If it fails to install the script still runs and uploads original bytes.
      - name: Install sharp (optional logo resize)
        run: npm install sharp || echo "sharp unavailable; logos upload unresized"
      - name: Run merchant status sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KANJO_DESOUK }}
          FIREBASE_PROJECT_ID: kanjo-desouk
          FIREBASE_STORAGE_BUCKET: kanjo-desouk.firebasestorage.app
        run: node scripts/sync-merchant-status.mjs
