# Backfills a permanent, immutable merchantId for every existing merchant
# (grouped by base-name) and upserts the authoritative `merchants` records.
# Runs on push to main when the script changes, or manually.
name: Backfill merchant IDs
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/backfill-merchant-ids.mjs'
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install firebase-admin
        run: npm install firebase-admin@12
      - name: Run merchant-ID backfill
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KANJO_DESOUK }}
        run: node scripts/backfill-merchant-ids.mjs
