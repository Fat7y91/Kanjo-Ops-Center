name: Provision Auth Claims (RBAC)

# Manual-only. Each phase is a separate, explicit dispatch so the destructive
# `enforce` switch can never be flipped in the same run as `apply-auto`.
# Recommended order: list -> auto-dry -> apply-auto -> (users reload) -> enforce.
# Rollback at any time with `unenforce`.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Provisioning action"
        required: true
        default: "list"
        type: choice
        options:
          - "list"
          - "status"
          - "auto-dry"
          - "apply-auto"
          - "enforce"
          - "unenforce"

permissions:
  contents: read

concurrency:
  group: provision-auth-claims
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The script is ESM: NODE_PATH is ignored, and a symlink to the global
      # package leaves firebase-admin's own deps (e.g. @google-cloud/firestore)
      # unresolvable. A local install is required. Node 22 satisfies the
      # firebase-admin >=22 engine requirement.
      - name: Install Firebase Admin SDK
        run: npm install --no-save --no-package-lock firebase-admin@latest

      - name: List auth users and enrollment hints
        if: inputs.mode == 'list'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KANJO_DESOUK }}
        run: node scripts/set-auth-claims.mjs --list

      - name: Report migration status
        if: inputs.mode == 'status'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KANJO_DESOUK }}
        run: node scripts/set-auth-claims.mjs --status

      - name: Auto-map (dry-run, writes nothing)
        if: inputs.mode == 'auto-dry'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KANJO_DESOUK }}
          SYNC_DRY_RUN: "1"
        run: node scripts/set-auth-claims.mjs --auto

      - name: Apply auto claims
        if: inputs.mode == 'apply-auto'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KANJO_DESOUK }}
        run: node scripts/set-auth-claims.mjs --auto

      - name: Verify claims exist before enforcing
        if: inputs.mode == 'enforce'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KANJO_DESOUK }}
        run: node scripts/set-auth-claims.mjs --verify

      - name: Enforce strict RBAC
        if: inputs.mode == 'enforce'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KANJO_DESOUK }}
        run: node scripts/set-auth-claims.mjs --enforce

      - name: Unenforce RBAC (rollback to legacy mode)
        if: inputs.mode == 'unenforce'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KANJO_DESOUK }}
        run: node scripts/set-auth-claims.mjs --unenforce

      - name: Summary
        if: always()
        run: |
          {
            echo "### Auth claims provisioning: \`${{ inputs.mode }}\`"
            echo ""
            echo "- Workflow: \`.github/workflows/provision-auth-claims.yml\`"
            echo "- Script: \`node scripts/set-auth-claims.mjs\`"
            echo ""
            echo "Review the logs above for the uid/identity mapping and written counts."
          } >> "$GITHUB_STEP_SUMMARY"
